interface:
  display_name: "公众号排版"
  short_description: "将已授权正文排版为含品牌首尾 GIF 的可评审 HTML。"
  default_prompt: "Use $wechat-styler to format the supplied article and generate a reviewable preview, reusing the confirmed theme and scope."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets: ["openai"]
  activation:
    mode: "model"
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "metadata-adapter"
